name: postgres-command-executer

services:
  postgres:
    image: postgres:18
    container_name: postgres-command-executer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_executor_dev}
      POSTGRES_USER: ${POSTGRES_USER:-executor_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: America/Cuiaba
    ports:
      # Nunca remova o IP: ele impede acesso ao banco pela rede externa.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 usa subdiretório versionado dentro deste caminho.
      - postgres_dev_data:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_dev_data:
    name: postgres-command-executer-data-v18
